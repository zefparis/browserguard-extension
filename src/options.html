<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowserGuard — Options</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      max-width: 560px; margin: 0 auto; padding: 24px 16px;
      font-family: system-ui, sans-serif; font-size: 14px;
      background: #0f172a; color: #e2e8f0;
    }
    h1 { font-size: 18px; margin-bottom: 6px; color: #f1f5f9; }
    p.intro { color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
    label { display: block; color: #cbd5e1; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 10px 12px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
      font-family: ui-monospace, monospace; font-size: 13px;
    }
    input:focus { outline: 2px solid #38bdf8; outline-offset: 1px; }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    button {
      padding: 9px 18px; border-radius: 6px; border: 0; cursor: pointer;
      font-size: 13px; font-weight: 600;
    }
    #save { background: #2563eb; color: #fff; }
    #clear { background: #334155; color: #cbd5e1; }
    #msg { margin-top: 14px; min-height: 20px; font-size: 13px; }
    #msg.ok { color: #4ade80; }
    #msg.err { color: #f87171; }
    .note { margin-top: 18px; color: #7dd3a8; font-size: 12px; line-height: 1.5; }
    #history { margin-top: 28px; border-top: 1px solid #334155; padding-top: 14px; }
    #history h2 { font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
    #history-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    #history-list button {
      display: flex; justify-content: space-between; gap: 8px; width: 100%;
      padding: 6px 8px; border: none; border-radius: 4px;
      background: #1e293b; color: #cbd5e1; font-size: 13px;
      font-family: inherit; text-align: left; cursor: pointer;
    }
    #history-list button:hover { background: #273549; }
    #history-list button:focus-visible { outline: 2px solid #38bdf8; outline-offset: 1px; }
    #history-list .outcome { color: #94a3b8; font-family: ui-monospace, monospace; font-size: 12px; }
    #history-empty { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <h1 id="h1">BrowserGuard</h1>
  <p class="intro" id="intro"></p>
  <label for="key" id="keylabel"></label>
  <input type="password" id="key" autocomplete="off" spellcheck="false" />
  <div class="row">
    <button id="save"></button>
    <button id="clear"></button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
  <p class="note" id="note"></p>

  <div id="history">
    <h2 id="history-title"></h2>
    <ul id="history-list"></ul>
    <div id="history-empty"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
