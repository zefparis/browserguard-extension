<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowserGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px; padding: 14px 16px;
      font-family: system-ui, sans-serif; font-size: 13px;
      background: #0f172a; color: #e2e8f0;
    }
    h1 { font-size: 15px; margin-bottom: 10px; color: #f1f5f9; }
    .row { margin-bottom: 10px; }
    .label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    #status-line {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 6px; margin-top: 4px;
      background: #1e293b;
    }
    #status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    #status-text { line-height: 1.35; }
    #last-check, #version-line { color: #cbd5e1; margin-top: 4px; }
    #collected {
      border-top: 1px solid #334155; margin-top: 12px; padding-top: 10px;
      color: #94a3b8; font-size: 12px; line-height: 1.45;
    }
    #collected h2 { font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
    #collected .never { margin-top: 6px; color: #7dd3a8; }
    #history { border-top: 1px solid #334155; margin-top: 12px; padding-top: 10px; }
    #history h2 { font-size: 12px; color: #cbd5e1; margin-bottom: 6px; }
    #history-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    #history-list button {
      display: flex; justify-content: space-between; gap: 8px; width: 100%;
      padding: 4px 6px; border: none; border-radius: 4px;
      background: #1e293b; color: #cbd5e1; font-size: 12px;
      font-family: inherit; text-align: left; cursor: pointer;
    }
    #history-list button:hover { background: #273549; }
    #history-list button:focus-visible {
      outline: 2px solid #7dd3fc; outline-offset: 1px;
    }
    #history-list .outcome { color: #94a3b8; }
    #history-empty { color: #64748b; font-size: 12px; }
    a { color: #7dd3fc; }
    a:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid #7dd3fc; outline-offset: 2px; border-radius: 2px;
    }
    .footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    #privacy-link { font-size: 12px; }
    #version-line { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <h1 id="popup-title">BrowserGuard</h1>

  <div class="row">
    <div class="label" id="status-label"></div>
    <div id="status-line" role="status" aria-live="polite">
      <span id="status-dot" aria-hidden="true"></span>
      <span id="status-text"></span>
    </div>
  </div>

  <div class="row">
    <div class="label" id="last-check-label"></div>
    <div id="last-check"></div>
  </div>

  <div id="history">
    <h2 id="history-title"></h2>
    <ul id="history-list"></ul>
    <div id="history-empty"></div>
  </div>

  <div id="collected">
    <h2 id="collected-title"></h2>
    <div id="collected-items"></div>
    <div class="never" id="collected-never"></div>
  </div>

  <div class="footer">
    <a id="privacy-link" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
    <span id="version-line"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
