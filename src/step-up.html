<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification cognitive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0f172a; overflow: hidden; font-family: sans-serif; }
    #intro {
      position: absolute; top: 0; left: 0; right: 0; z-index: 2;
      padding: 8px 12px; font-size: 12px; text-align: center;
      color: #cbd5e1; background: #1e293b;
    }
    #iframe-container { width: 100%; height: 100%; padding-top: 32px; }
    #stepup-iframe { width: 100%; height: 100%; border: none; }
    #loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8; font-size: 14px; }
    #verdict {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 20px; text-align: center;
    }
    #verdict .v-icon { font-size: 40px; margin-bottom: 12px; }
    #verdict .v-text { font-size: 17px; font-weight: 600; }
    #verdict .v-sub { font-size: 12px; color: #94a3b8; margin-top: 8px; }
    #verdict.ok .v-icon, #verdict.ok .v-text { color: #4ade80; }
    #verdict.ko .v-icon, #verdict.ko .v-text { color: #f87171; }
    #verdict.neutral .v-icon, #verdict.neutral .v-text { color: #94a3b8; }
    .v-error { color: #ef4444; font-size: 13px; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div id="intro" role="note"></div>
  <div id="loading">…</div>
  <div id="iframe-container" style="display:none;">
    <iframe id="stepup-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
  <div id="verdict" role="status" aria-live="polite">
    <div class="v-icon" id="verdict-icon" aria-hidden="true"></div>
    <div class="v-text" id="verdict-text"></div>
    <div class="v-sub" id="verdict-sub"></div>
  </div>
  <script src="step-up.js"></script>
</body>
</html>
